name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install PyQt5 the way the README tells users to, so CI exercises the
      # same build they run. python3-pyqt5 brings QtDBus, which the AutoPA
      # D-Bus source uses when KStars is reachable.
      - name: Install PyQt5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pyqt5 libxkbcommon-x11-0

      - name: Check for syntax errors and undefined names
        run: |
          python3 -m pip install --quiet pyflakes
          python3 -m pyflakes oat_helper/ tests/

      # The suite needs no display: every test runs with QT_QPA_PLATFORM=offscreen
      # and starts its own fake INDI server on a private port.
      - name: Run the test suite
        run: python3 tests/run_all.py

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Syntax only. shellcheck's style rules are not enforced here, so that a
      # red build always means something is actually broken.
      - name: Check the installer scripts parse
        run: |
          for script in install.sh uninstall.sh _install_common.sh \
                        oat_helper/install.sh oat_helper/uninstall.sh; do
            bash -n "$script" && echo "ok   $script"
          done
